<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Saver Immediately</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input, textarea { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; font: inherit; }
    textarea { min-height: 180px; resize: vertical; }
    button { margin-top: 16px; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Save Feedback please.......................</h1>
  <form action="/save" method="POST">
    <label for="title">Title</label>
    <input id="title" name="title" required
           pattern="[A-Za-z0-9 _-]+"
           title="Use letters, numbers, spaces, underscores, or hyphens.">

    <label for="content">Content</label>
    <textarea id="content" name="content" required></textarea>

    <button type="submit">Save Here</button>
  </form>
</body>
</html>
